[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-review-custom-lstm"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "pypdf>=5", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
